name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  pipeline:
    uses: NNP-Platform-Components-PCOM/PCOM-CICD/.github/workflows/container-pipeline.yml@main
    secrets: inherit
    with:
      image-name: pcom-qat-k6
      image-version: "1.8.2"
      platforms: linux/amd64
